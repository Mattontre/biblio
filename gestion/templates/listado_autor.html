<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Listado</title>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-gH2yIJqKdNHPEq0n4Mqa/HGKIhSkIHeL5AyhkYV8i59U5AR6csBvApHHNl/vI1Bx" crossorigin="anonymous"/>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.9.1/font/bootstrap-icons.css"/>
        <script>
            const botonEliminar = (id) => {
                if(window.confirm("¿Está Seguro De Querer Eliminar El Registro?")){
                    window.location.href = "/eliminar_autor/"+id;
                }
            }
        </script>
    
    </head>
    <body>

        <div class="container">
            <h1 class="text-center">Listado de Autor</h1>
            <h4 class="text-center"><a href="/menu_admin">Volver al Index</a></h4>

            {% if r %}
                <div class="alert alert-success alert-dismissible fade show" role="alert">
                    <h5>{{ r }}</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endif %}

            {% if aut %}
                <table border="1" class="table table-hover text-center">
                    <tr bgcolor="lightgray">
                        <th>ID</th>
                        <th>NOMBRE</th>
                        <th>EDITAR</th>
                        <th>ELIMINAR</th>
                    </tr>

                {% for x in aut %}    
                    <tr class="align-middle">
                        <td>{{ x.id }}</td>
                        <td>{{ x.nombre }}</td>
                        <td>
                            <a href="/form_actualizar_autor/{{ x.id }}" class="btn btn-lg">
                                <i class="bi bi-pencil-fill"></i>
                            </a>
                        </td>
                        <td>
                            <button type="button" onClick="botonEliminar({{ x.id }})" class="btn btn-lg">
                                <i class="bi bi-trash-fill"></i>
                            </button>
                        </td>
                    </tr>
                {% endfor %}
                    
                </table>
                <br/>
            
            {% else %}

                <h2 class="text-center  text-danger">No Hay Registros De autoresS Para Listar</h2>

            {% endif %}
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-A3rJD856KowSb7dwlZdYEkO39Gagi7vIsF0jrRAoQmDKKtQBHUuLZ9AsSv4jD4Xa" crossorigin="anonymous"></script>
    </body>
</html>
