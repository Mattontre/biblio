<!DOCTYPE html>
<html>
	<head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-gH2yIJqKdNHPEq0n4Mqa/HGKIhSkIHeL5AyhkYV8i59U5AR6csBvApHHNl/vI1Bx" crossorigin="anonymous">
    </head>
	<body>
		<div class="container">
			<h1 class="text-center">Formulario de Registro de Cliente</h1>
            <h4 class="text-center"><a href="/menu_admin">Volver al Index</a></h4>
			
			{% if r %}
				<div class="alert alert-success alert-dismissible fade show" role="alert">
					<h5>{{ r }}</h5>
					<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
				</div>
			{% endif %}  
		
			<form action="/insertar_cliente" method="post">
				{% csrf_token %}
				<center>
					<input class="form-control form-control-lg text-center" style="margin-bottom:10px; width:95%;"  type="text"  placeholder="Rut del cliente"  name="txtrut"  required/>
					<br/>
					<input class="form-control form-control-lg text-center" style="margin-bottom:10px; width:95%;"  type="text"  placeholder="Nombre del cliente"  name="txtnom"  required/>
					<br/>
					<div class="text-center">
						<input class="form-check-input h4" checked type="radio" id="op1" name="opest" value="Activo"/>
						<label class="form-check-label h3" for="op1">Activo</label>
						&nbsp;&nbsp;&nbsp;
						<input class="form-check-input h4" type="radio" id="op2" name="opest" value="Bloqueado"/>
						<label class="form-check-label h3" for="op2">Bloqueado</label>
					</div>
					<input type="submit" class="btn btn-primary btn-lg"     style="width:95%;" value="Registrar"/>
				</center>
			</form>
		</div>
	
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/js/bootstrap.bundle.min.js" integrity="sha384-pprn3073KE6tl6bjs2QrFaJGz5/SUsLqktiwsUTF55Jfv3qYSDhgCecCxMW52nD2" crossorigin="anonymous"></script>
	
	</body>
</html>
