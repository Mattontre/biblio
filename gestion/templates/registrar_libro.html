<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Formulario</title>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-gH2yIJqKdNHPEq0n4Mqa/HGKIhSkIHeL5AyhkYV8i59U5AR6csBvApHHNl/vI1Bx" crossorigin="anonymous">
    </head>
    <body>

        <div class="container">
            <h1 class="text-center">Formulario de Registro de libros</h1>
            <h4 class="text-center"><a href="/menu_admin">Volver al Index</a></h4>

            {% if r %}
                <div class="alert alert-success alert-dismissible fade show" role="alert">
                    <h5>{{ r }}</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endif %}

            <form action="/insertar_libro" method="post">
                {% csrf_token %}
                
                <input type="text" name="txttit" placeholder="titulo de libro" required class="form-control form-control-lg" />

                <br/>
                
                <select name="cboaut" required class="form-select form-select-lg">
                    <option value="">Seleccione autor</option>
                    {% for x in aut %}
                        <option value="{{ x.id }}">{{ x.nombre }}</option>
                    {% endfor %}
                </select>

                <br/>

                <select name="cboedi" required class="form-select form-select-lg">
                    <option value="">Seleccione editorial</option>
                    {% for x in edi %}
                        <option value="{{ x.id }}">{{ x.nombre }}</option>
                    {% endfor %}
                </select>

                <br/>

                <select name="cbogen" required class="form-select form-select-lg">
                    <option value="">Seleccione genero</option>
                    {% for x in gen %}
                        <option value="{{ x.id }}">{{ x.nombre }}</option>
                    {% endfor %}
                </select>
                
                <br/>
                
                <input type="submit" value="Guardar Datos" class="btn btn-primary btn-lg" style="width:100%"/>
            </form>

        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-A3rJD856KowSb7dwlZdYEkO39Gagi7vIsF0jrRAoQmDKKtQBHUuLZ9AsSv4jD4Xa" crossorigin="anonymous"></script>
    </body>
</html>
