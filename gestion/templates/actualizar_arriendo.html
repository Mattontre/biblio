<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-gH2yIJqKdNHPEq0n4Mqa/HGKIhSkIHeL5AyhkYV8i59U5AR6csBvApHHNl/vI1Bx" crossorigin="anonymous">
    </head>
    <body>

        
        <div class="container">
            <h1 class="text-center">Actualizar Datos de Arriendo</h1>
            <h4 class="text-center"><a href="/listado_arriendo">Cancelar</a></h4>


            <form action="/actualizar_arriendo/{{ arr.id }}" method="post">
                {% csrf_token %}
                
                <input type="date" name="txtfin" value="{{ fecha }}" placeholder="Nombre de Intérprete" required class="form-control form-control-lg" />

                <br/>
                
                <select name="cbolib" required class="form-select form-select-lg">
                    <option value="">Seleccione libro</option>
                    {% for x in lib %}
                        {% if arr.libro_id == x.id %}
                            <option value="{{ x.id }}" selected>{{ x.titulo }}</option>
                        {% else %}
                            <option value="{{ x.id }}">{{ x.titulo }}</option>
                        {% endif %}
                    {% endfor %}
                </select>

                <br/>
                <select name="cbocli" required class="form-select form-select-lg">
                    <option value="">Seleccione cliente</option>
                    {% for x in cli %}
                        {% if arr.cliente_id == x.rut %}
                            <option value="{{ x.rut }}" selected>{{ x.nombre }}</option>
                        {% else %}
                            <option value="{{ x.rut }}">{{ x.nombre }}</option>
                        {% endif %}
                    {% endfor %}
                </select>

                <br/>
                <input type="submit" value="Guardar Datos" class="btn btn-primary btn-lg" style="width:100%"/>
            </form>

        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-A3rJD856KowSb7dwlZdYEkO39Gagi7vIsF0jrRAoQmDKKtQBHUuLZ9AsSv4jD4Xa" crossorigin="anonymous"></script>

    </body>
</html>
