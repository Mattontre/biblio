<!DOCTYPE html>
<html lang="es">
<head>

    {% load static %}

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Inicio</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.9.1/font/bootstrap-icons.css">

    <style>
        body{
            background: linear-gradient(135deg,#0d6efd,#6ea8fe);
            min-height:100vh;
        }

        .contenido{
            margin-top:40px;
        }

        .card-menu{
            border:none;
            border-radius:15px;
            box-shadow:0px 10px 25px rgba(0,0,0,.2);
        }

        .opcion{
            transition:.3s;
        }

        .opcion:hover{
            transform:translateY(-5px);
            box-shadow:0px 5px 15px rgba(0,0,0,.2);
        }

        .navbar{
            box-shadow:0px 5px 15px rgba(0,0,0,.15);
        }

        .usuario{
            font-weight:bold;
            font-size:18px;
        }
    </style>

    <script>
        const botonCerrarSesion = () =>{
            if(confirm("¿Está seguro de cerrar la sesión?")){
                location.href="/logout";
            }
        }
    </script>

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">

        <a class="navbar-brand fw-bold" href="/menu_usuario">
            <i class="bi bi-house-door-fill"></i> Sistema de Arriendos
        </a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">

            <ul class="navbar-nav ms-auto align-items-center">

                <li class="nav-item me-3">
                    <span class="text-white usuario">
                        <i class="bi bi-person-circle"></i>
                        {{ nomUsuario }}
                    </span>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="/menu_usuario">
                        <i class="bi bi-house"></i>
                        Inicio
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/form_registrar_arriendo">
                        <i class="bi bi-plus-circle"></i>
                        Registrar Arriendo
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/listado_arriendo">
                        <i class="bi bi-list-ul"></i>
                        Listado
                    </a>
                </li>

                <li class="nav-item">
                    <button class="btn btn-danger ms-3" onclick="botonCerrarSesion()">
                        <i class="bi bi-box-arrow-right"></i>
                        Cerrar Sesión
                    </button>
                </li>

            </ul>

        </div>

    </div>
</nav>

<div class="container contenido">

    <div class="card card-menu">

        <div class="card-body p-5">

            <h2 class="text-primary mb-3">
                Bienvenido
            </h2>

            <h4 class="mb-5">
                {{ nomUsuario }}
            </h4>

            <div class="row g-4">

                <div class="col-md-6">

                    <div class="card opcion h-100">
                        <div class="card-body text-center">

                            <i class="bi bi-file-earmark-plus display-3 text-primary"></i>

                            <h4 class="mt-3">
                                Registrar Arriendo
                            </h4>

                            <p>
                                Ingresa un nuevo arriendo al sistema.
                            </p>

                            <a href="/form_registrar_arriendo"
                               class="btn btn-primary">
                                Ir
                            </a>

                        </div>
                    </div>

                </div>

                <div class="col-md-6">

                    <div class="card opcion h-100">
                        <div class="card-body text-center">

                            <i class="bi bi-card-list display-3 text-success"></i>

                            <h4 class="mt-3">
                                Listado de Arriendos
                            </h4>

                            <p>
                                Consulta todos los arriendos registrados.
                            </p>

                            <a href="/listado_arriendo"
                               class="btn btn-success">
                                Ver listado
                            </a>

                        </div>
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
